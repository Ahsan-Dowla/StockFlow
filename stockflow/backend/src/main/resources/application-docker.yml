server:
  port: 8090

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/stockflow}
    username: ${DB_USERNAME:stockflow_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://frontend:80}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.stockflow: INFO
